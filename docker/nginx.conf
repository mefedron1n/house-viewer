limit_req_zone $binary_remote_addr zone=api_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=client_connections:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 20s;
    limit_conn client_connections 30;
    limit_conn_status 429;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location /api/ {
        limit_req zone=api_requests burst=30 nodelay;
        proxy_pass http://ifc-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        client_max_body_size 200m;
    }

    location = /health {
        proxy_pass http://ifc-api:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backward-compatible entry point for room URLs created by older frontend builds.
    # viewer.html reads the current /rooms/:slug pathname and opens that room client-side.
    location /rooms/ {
        try_files /viewer.html =404;
    }

    # Only browser assets are public: never serve the repository or server data.
    location ~ (^|/)\. { return 404; }
    location = / { try_files /index.html =404; }
    location ~ ^/(index|auth|studio|project|room|viewer)\.html$ { try_files $uri =404; }
    location ~ ^/(scripts|styles|images|img|vendor)/.+\.(js|css|png|jpe?g|webp|svg|ico|woff2?|wasm)$ {
        try_files $uri =404;
    }
    location = /models/house.glb { try_files $uri =404; }
    location / { return 404; }
}
