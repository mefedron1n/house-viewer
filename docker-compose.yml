services:
  ifc-api:
    build: ./server
    ports: ["3001:3001"]
    env_file: ./server/.env
    environment:
      NODE_ENV: development
      MODEL_STORAGE_DIR: /data/models
      TEMP_DIR: /data/tmp
      IFC_CONVERT_PATH: /opt/conda/bin/IfcConvert
    volumes: ["ifc-models:/data/models"]
    networks: ["house-viewer-net"]
  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    depends_on:
      ifc-api:
        condition: service_healthy
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: ["house-viewer-net"]
volumes:
  ifc-models:
networks:
  house-viewer-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
