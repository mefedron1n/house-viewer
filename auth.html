<body class="auth-body"><main class="auth-layout"><a class="wordmark auth-brand" href="./"><span>H</span>House Reviewer</a><section class="auth-note"><p class="kicker light">Пространство проекта</p><h1>Дом начинается<br>с внимательного<br><em>взгляда.</em></h1><p>Все модели, материалы и решения вашей команды — в одном спокойном рабочем пространстве.</p></section><section class="auth-panel"><div class="auth-tabs"><button data-auth-mode="login">Вход</button><button data-auth-mode="register">Регистрация</button></div><form id="auth-form"><p class="kicker" id="auth-kicker">С возвращением</p><h2 id="auth-title">Войти в кабинет</h2><label id="name-field">Ваше имя<input name="name" autocomplete="name" placeholder="Анна Смирнова"></label><label>Электронная почта<input name="email" type="email" autocomplete="email" placeholder="name@studio.ru" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" minlength="6" placeholder="Не менее 6 символов" required></label><button class="button auth-submit" type="submit"><span id="auth-submit-text">Войти</span><span>↗</span></button><p class="form-status" id="auth-status" aria-live="polite"></p></form><p class="auth-terms">Продолжая, вы принимаете условия сервиса и политику конфиденциальности.</p></section></main><script src="./scripts/editorial.js?v=1"></script></body></html>
